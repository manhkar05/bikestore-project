<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Integration - Bikestore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">🧪 Test Integration - Bikestore</h1>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-server me-2"></i>Backend Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="backend-status" class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Đang kiểm tra kết nối...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-database me-2"></i>Database Status</h5>
                    </div>
                    <div class="card-body">
                        <div id="database-status" class="text-center">
                            <div class="spinner-border text-info" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Đang kiểm tra database...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-list-check me-2"></i>API Tests</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <button class="btn btn-outline-primary w-100 mb-2" onclick="testProductsAPI()">
                                    <i class="bi bi-box"></i> Test Products API
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-success w-100 mb-2" onclick="testUsersAPI()">
                                    <i class="bi bi-people"></i> Test Users API
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-warning w-100 mb-2" onclick="testOrdersAPI()">
                                    <i class="bi bi-cart"></i> Test Orders API
                                </button>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-4">
                                <button class="btn btn-outline-info w-100 mb-2" onclick="testDashboardAPI()">
                                    <i class="bi bi-graph-up"></i> Test Dashboard API
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-secondary w-100 mb-2" onclick="testSearchAPI()">
                                    <i class="bi bi-search"></i> Test Search API
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-danger w-100 mb-2" onclick="runAllTests()">
                                    <i class="bi bi-play-circle"></i> Run All Tests
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-terminal me-2"></i>Test Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="test-results" class="bg-light p-3 rounded" style="min-height: 200px; font-family: monospace;">
                            <p class="text-muted">Kết quả test sẽ hiển thị ở đây...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-info-circle me-2"></i>Quick Links</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <a href="fontend/html/Trang Chủ.html" class="btn btn-primary w-100 mb-2">
                                    <i class="bi bi-house"></i> Trang Chủ
                                </a>
                            </div>
                            <div class="col-md-3">
                                <a href="fontend/html/Trang ds sp.html" class="btn btn-success w-100 mb-2">
                                    <i class="bi bi-shop"></i> Cửa Hàng
                                </a>
                            </div>
                            <div class="col-md-3">
                                <a href="fontend/html/Trang đăng nhập.html" class="btn btn-warning w-100 mb-2">
                                    <i class="bi bi-person"></i> Đăng Nhập
                                </a>
                            </div>
                            <div class="col-md-3">
                                <a href="http://localhost:8080/api/products" class="btn btn-info w-100 mb-2" target="_blank">
                                    <i class="bi bi-link"></i> API Products
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let testResults = [];

        // Test backend connection
        async function testBackendConnection() {
            try {
                const response = await fetch(`${API_BASE_URL}/products`);
                if (response.ok) {
                    document.getElementById('backend-status').innerHTML = `
                        <i class="bi bi-check-circle-fill text-success fs-1"></i>
                        <p class="mt-2 text-success">Backend đang hoạt động</p>
                    `;
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                document.getElementById('backend-status').innerHTML = `
                    <i class="bi bi-x-circle-fill text-danger fs-1"></i>
                    <p class="mt-2 text-danger">Backend không hoạt động</p>
                    <small class="text-muted">Lỗi: ${error.message}</small>
                `;
                return false;
            }
        }

        // Test database connection
        async function testDatabaseConnection() {
            try {
                const response = await fetch(`${API_BASE_URL}/dashboard/products`);
                if (response.ok) {
                    document.getElementById('database-status').innerHTML = `
                        <i class="bi bi-check-circle-fill text-success fs-1"></i>
                        <p class="mt-2 text-success">Database kết nối thành công</p>
                    `;
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                document.getElementById('database-status').innerHTML = `
                    <i class="bi bi-x-circle-fill text-danger fs-1"></i>
                    <p class="mt-2 text-danger">Database không kết nối được</p>
                    <small class="text-muted">Lỗi: ${error.message}</small>
                `;
                return false;
            }
        }

        // Test Products API
        async function testProductsAPI() {
            addTestResult('🔄 Testing Products API...');
            try {
                const response = await fetch(`${API_BASE_URL}/products`);
                const data = await response.json();

                if (response.ok) {
                    addTestResult(`✅ Products API: OK (${data.length} products found)`);
                } else {
                    addTestResult(`❌ Products API: Failed - ${response.status}`);
                }
            } catch (error) {
                addTestResult(`❌ Products API: Error - ${error.message}`);
            }
        }

        // Test Users API
        async function testUsersAPI() {
            addTestResult('🔄 Testing Users API...');
            try {
                // Test register
                const registerData = {
                    name: 'Test User',
                    email: 'test@example.com',
                    password: '123456'
                };

                const registerResponse = await fetch(`${API_BASE_URL}/users/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData)
                });

                if (registerResponse.ok) {
                    addTestResult('✅ Users API: Register OK');
                } else {
                    addTestResult(`❌ Users API: Register Failed - ${registerResponse.status}`);
                }
            } catch (error) {
                addTestResult(`❌ Users API: Error - ${error.message}`);
            }
        }

        // Test Orders API
        async function testOrdersAPI() {
            addTestResult('🔄 Testing Orders API...');
            try {
                const response = await fetch(`${API_BASE_URL}/orders`);

                if (response.ok) {
                    addTestResult('✅ Orders API: OK');
                } else {
                    addTestResult(`❌ Orders API: Failed - ${response.status}`);
                }
            } catch (error) {
                addTestResult(`❌ Orders API: Error - ${error.message}`);
            }
        }

        // Test Dashboard API
        async function testDashboardAPI() {
            addTestResult('🔄 Testing Dashboard API...');
            try {
                const response = await fetch(`${API_BASE_URL}/dashboard/orders`);

                if (response.ok) {
                    addTestResult('✅ Dashboard API: OK');
                } else {
                    addTestResult(`❌ Dashboard API: Failed - ${response.status}`);
                }
            } catch (error) {
                addTestResult(`❌ Dashboard API: Error - ${error.message}`);
            }
        }

        // Test Search API
        async function testSearchAPI() {
            addTestResult('🔄 Testing Search API...');
            try {
                const response = await fetch(`${API_BASE_URL}/products/search?name=test`);

                if (response.ok) {
                    addTestResult('✅ Search API: OK');
                } else {
                    addTestResult(`❌ Search API: Failed - ${response.status}`);
                }
            } catch (error) {
                addTestResult(`❌ Search API: Error - ${error.message}`);
            }
        }

        // Run all tests
        async function runAllTests() {
            addTestResult('🚀 Running all tests...');
            addTestResult('='.repeat(50));

            await testProductsAPI();
            await testUsersAPI();
            await testOrdersAPI();
            await testDashboardAPI();
            await testSearchAPI();

            addTestResult('='.repeat(50));
            addTestResult('✅ All tests completed!');
        }

        // Add test result
        function addTestResult(message) {
            const timestamp = new Date().toLocaleTimeString();
            const result = `[${timestamp}] ${message}`;
            testResults.push(result);

            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = testResults.join('<br>');
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        // Initialize tests
        window.onload = async function() {
            addTestResult('🔧 Initializing integration tests...');

            const backendOk = await testBackendConnection();
            const databaseOk = await testDatabaseConnection();

            if (backendOk && databaseOk) {
                addTestResult('✅ System ready for testing!');
            } else {
                addTestResult('❌ System not ready. Please check backend and database.');
            }
        };
    </script>
</body>

</html>
