<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Transaction Creation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="fontend/css/bootstrap.min.css" rel="stylesheet">
    <link href="fontend/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Transaction Creation</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Order Creation (Creates Transaction)</h5>
                    </div>
                    <div class="card-body">
                        <button id="testOrder" class="btn btn-primary">Test Create Order + Transaction</button>
                        <div id="orderResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>View All Transactions</h5>
                    </div>
                    <div class="card-body">
                        <button id="viewTransactions" class="btn btn-info">View All Transactions</button>
                        <div id="transactionResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="fontend/js/api.js"></script>
    <script>
        // Add transaction API methods
        ApiService.getAllTransactions = async function() {
            return this.request('/transactions');
        };

        document.getElementById('testOrder').addEventListener('click', async function() {
            const resultDiv = document.getElementById('orderResult');
            resultDiv.innerHTML = '<div class="spinner-border" role="status"></div> Testing...';
            
            try {
                // Test data
                const testOrderData = {
                    userId: "GUEST_" + Date.now(),
                    items: [
                        {
                            productId: "test-product-1",
                            quantity: 2
                        }
                    ],
                    paymentMethod: "cod",
                    shippingAddress: "123 Test Street, Test City"
                };
                
                console.log('Sending order data:', testOrderData);
                
                const order = await ApiService.createOrder(testOrderData);
                
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h6>Order Created Successfully!</h6>
                        <p><strong>Order ID:</strong> ${order.id}</p>
                        <p><strong>User ID:</strong> ${order.userId}</p>
                        <p><strong>Total Price:</strong> ${order.totalPrice}</p>
                        <p><strong>Status:</strong> ${order.status}</p>
                        <small class="text-muted">Transaction should also be created automatically</small>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error creating order:', error);
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>Error Creating Order</h6>
                        <p>${error.message}</p>
                        <p>Status: ${error.status}</p>
                    </div>
                `;
            }
        });

        document.getElementById('viewTransactions').addEventListener('click', async function() {
            const resultDiv = document.getElementById('transactionResult');
            resultDiv.innerHTML = '<div class="spinner-border" role="status"></div> Loading...';
            
            try {
                const transactions = await ApiService.getAllTransactions();
                
                if (transactions.length === 0) {
                    resultDiv.innerHTML = '<div class="alert alert-info">No transactions found</div>';
                    return;
                }
                
                const transactionsHTML = transactions.map(transaction => `
                    <div class="card mb-2">
                        <div class="card-body">
                            <h6>Transaction ID: ${transaction.id}</h6>
                            <p><strong>Customer ID:</strong> ${transaction.customerId}</p>
                            <p><strong>Total Amount:</strong> ${transaction.totalAmount}</p>
                            <p><strong>Status:</strong> ${transaction.status}</p>
                            <p><strong>Created:</strong> ${new Date(transaction.createdAt).toLocaleString()}</p>
                            <p><strong>Products:</strong> ${transaction.products.length} items</p>
                        </div>
                    </div>
                `).join('');
                
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h6>Found ${transactions.length} transactions</h6>
                    </div>
                    ${transactionsHTML}
                `;
                
            } catch (error) {
                console.error('Error fetching transactions:', error);
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>Error Fetching Transactions</h6>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
